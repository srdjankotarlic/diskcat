<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DiskCat purple cat app icon</title>
  <desc id="desc">A simple purple app tile with the DiskCat white cat mark.</desc>
  <defs>
    <linearGradient id="tile" x1="70" y1="54" x2="442" y2="462" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B96FF"/>
      <stop offset=".55" stop-color="#7D83FF"/>
      <stop offset="1" stop-color="#6972F2"/>
    </linearGradient>
    <linearGradient id="cat" x1="154" y1="93" x2="358" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF2DD"/>
    </linearGradient>
    <filter id="cat-shadow" x="78" y="64" width="356" height="392" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="14" flood-color="#30346B" flood-opacity=".22" stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity=".18" stroke-width="2"/>

  <g id="dc-purple-cat-mark" filter="url(#cat-shadow)">
    <path d="M155 238 124 101c-2-11 11-18 20-10l102 88" fill="url(#cat)"/>
    <path d="M357 238 388 101c2-11-11-18-20-10l-102 88" fill="url(#cat)"/>
    <path d="M179 218 160 130l63 58" fill="#FFC3D6"/>
    <path d="M333 218 352 130l-63 58" fill="#FFC3D6"/>
    <ellipse cx="256" cy="304" rx="148" ry="136" fill="url(#cat)"/>

    <ellipse cx="202" cy="287" rx="18" ry="27" fill="#22253B"/>
    <ellipse cx="310" cy="287" rx="18" ry="27" fill="#22253B"/>
    <circle cx="196" cy="277" r="6" fill="#FFFFFF"/>
    <circle cx="304" cy="277" r="6" fill="#FFFFFF"/>
    <path d="M239 343h34l-17 17-17-17Z" fill="#FF7FA5"/>
    <path d="M256 359c-12 17-25 21-38 12M256 359c12 17 25 21 38 12" fill="none" stroke="#22253B" stroke-linecap="round" stroke-width="7"/>

    <g stroke="#22253B" stroke-linecap="round" stroke-width="6" opacity=".34">
      <path d="M101 300h72"/>
      <path d="M103 332h70"/>
      <path d="M339 300h72"/>
      <path d="M339 332h70"/>
    </g>
  </g>
